server {
    listen 8080;
    server_name _;

    location /octate-brand/ {
        alias /brand/;
    }

    location / {
        proxy_pass http://cvat-ui:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<link rel="stylesheet" href="/octate-brand/header.css?v=8"><script src="/octate-brand/header.js?v=8" defer></script></head>';
        sub_filter_once on;
    }
}
