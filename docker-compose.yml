#
# Default `docker compose up` starts the CVAT server (API and workers), the
# Octate Next.js frontend, and the local model gateway. CVAT's own UI is not run.

name: octate

x-cvat-environment: &cvat-environment
  CVAT_POSTGRES_HOST: cvat_db
  CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
  CVAT_REDIS_INMEM_PORT: 6379
  CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
  CVAT_REDIS_ONDISK_PORT: 6666
  CVAT_LOG_IMPORT_ERRORS: "true"
  CVAT_ALLOW_STATIC_CACHE: "${CVAT_ALLOW_STATIC_CACHE:-no}"
  CVAT_NUM_PROXIES: "1"
  CVAT_ANALYTICS: "0"
  CVAT_SERVERLESS: "1"
  CVAT_NUCLIO_HOST: octate-model-gateway
  CVAT_NUCLIO_PORT: "8090"
  CVAT_NUCLIO_INVOKE_METHOD: dashboard
  SMOKESCREEN_OPTS: ""
  no_proxy: "opa,cvat-server,cvat_db,cvat_redis_inmem,cvat_redis_ondisk,octate-model-gateway"

x-cvat-dependencies: &cvat-dependencies
  cvat_db:
    condition: service_started
  cvat_redis_inmem:
    condition: service_started
  cvat_redis_ondisk:
    condition: service_started
  octate-model-gateway:
    condition: service_started

x-cvat-worker: &cvat-worker
  image: cvat/server:${CVAT_VERSION:-v2.80.0}
  restart: unless-stopped
  depends_on: *cvat-dependencies
  environment:
    <<: *cvat-environment
    CVAT_REDIS_INMEM_PASSWORD: ""
  volumes:
    - cvat_data:/home/django/data
    - cvat_keys:/home/django/keys
    - cvat_logs:/home/django/logs
  networks:
    - cvat

services:
  cvat_db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: cvat
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - cvat_db:/var/lib/postgresql/data
    networks:
      - cvat

  cvat_redis_inmem:
    image: redis:7.2.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "100", "--appendonly", "yes"]
    volumes:
      - cvat_inmem_db:/data
    networks:
      - cvat

  cvat_redis_ondisk:
    image: apache/kvrocks:2.15.0
    restart: unless-stopped
    volumes:
      - cvat_cache_db:/var/lib/kvrocks
    networks:
      - cvat

  cvat_opa:
    image: openpolicyagent/opa:1.12.2
    restart: unless-stopped
    command:
      - run
      - --server
      - --addr=:8181
      - --log-level=error
      - --set=services.cvat.url=http://cvat-server:8080
      - --set=bundles.cvat.service=cvat
      - --set=bundles.cvat.resource=/api/auth/rules
      - --set=bundles.cvat.polling.min_delay_seconds=5
      - --set=bundles.cvat.polling.max_delay_seconds=15
    networks:
      cvat:
        aliases:
          - opa

  cvat_server:
    image: cvat/server:${CVAT_VERSION:-v2.80.0}
    restart: unless-stopped
    depends_on:
      <<: *cvat-dependencies
      cvat_opa:
        condition: service_started
    environment:
      <<: *cvat-environment
      DJANGO_MODWSGI_EXTRA_ARGS: ""
      ALLOWED_HOSTS: "*"
      NUMPROCS: 2
    command: init run server nginx
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
    labels:
      traefik.enable: "true"
      traefik.http.services.cvat-api.loadbalancer.server.port: "8080"
      traefik.http.routers.cvat-api.rule: "Host(`${CVAT_HOST:-localhost}`) && (PathPrefix(`/api/`) || PathPrefix(`/static/`) || PathPrefix(`/admin`) || PathPrefix(`/django-rq`))"
      traefik.http.routers.cvat-api.entrypoints: web
      traefik.http.routers.cvat-api.priority: "200"
    networks:
      cvat:
        aliases:
          - cvat-server

  # One worker: import the upload, split frames, run model jobs, export, clean up.
  cvat_worker:
    <<: *cvat-worker
    command: run worker chunks import export annotation cleaning --with-scheduler

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - cvat_server
    environment:
      API_SERVER_URL: http://cvat_server:8080
    labels:
      traefik.enable: "true"
      traefik.http.services.octate-ui.loadbalancer.server.port: "3000"
      traefik.http.routers.octate-ui.rule: "Host(`${CVAT_HOST:-localhost}`)"
      traefik.http.routers.octate-ui.entrypoints: web
      traefik.http.routers.octate-ui.priority: "10"
      traefik.http.routers.octate-ui.service: octate-ui
    networks:
      - cvat

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    ports:
      - "${OCTATE_PORT:-8080}:8080"
    environment:
      CVAT_HOST: "${CVAT_HOST:-localhost}"
      TRAEFIK_ENTRYPOINTS_web_ADDRESS: :8080
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: octate_cvat
      TRAEFIK_LOG_LEVEL: WARN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cvat

  octate-model-gateway:
    build:
      context: ./model-server
    restart: unless-stopped
    environment:
      PORT: 8090
      OCTATE_MODEL_MODE: "${OCTATE_MODEL_MODE:-local}"
      OCTATE_DETECTOR_MODEL: /app/yolov8s-worldv2.pt
      OCTATE_SAM_MODEL: /app/mobile_sam.pt
    volumes:
      - ./model-server:/app
      - octate_models:/models
    expose:
      - "8090"
    ports:
      - "127.0.0.1:${OCTATE_MODEL_PORT:-8091}:8090"
    labels:
      traefik.enable: "true"
      traefik.http.services.octate-models.loadbalancer.server.port: "8090"
      traefik.http.routers.octate-models.rule: "Host(`${CVAT_HOST:-localhost}`) && PathPrefix(`/model-api`)"
      traefik.http.routers.octate-models.entrypoints: web
      traefik.http.routers.octate-models.priority: "150"
      traefik.http.middlewares.octate-models-strip.stripprefix.prefixes: "/model-api"
      traefik.http.routers.octate-models.middlewares: octate-models-strip
    networks:
      - cvat

volumes:
  cvat_db:
  cvat_data:
  cvat_keys:
  cvat_logs:
  cvat_inmem_db:
  cvat_cache_db:
  octate_models:

networks:
  cvat:
