# Octate's Next.js shell owns every dashboard route. The unmodified CVAT UI
# owns the annotation workflow. Traefik serves both on one origin.

name: octate

x-cvat-environment: &cvat-environment
  CVAT_POSTGRES_HOST: cvat_db
  CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
  CVAT_REDIS_INMEM_PORT: 6379
  CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
  CVAT_REDIS_ONDISK_PORT: 6666
  CVAT_LOG_IMPORT_ERRORS: "true"
  CVAT_ALLOW_STATIC_CACHE: "${CVAT_ALLOW_STATIC_CACHE:-no}"
  CVAT_NUM_PROXIES: "1"
  CVAT_ANALYTICS: "0"
  CVAT_SERVERLESS: "0"
  SMOKESCREEN_OPTS: ""
  no_proxy: "opa,cvat-server,cvat_db,cvat_redis_inmem,cvat_redis_ondisk,octate-model-gateway"

x-cvat-dependencies: &cvat-dependencies
  cvat_db:
    condition: service_started
  cvat_redis_inmem:
    condition: service_started
  cvat_redis_ondisk:
    condition: service_started

x-cvat-worker: &cvat-worker
  image: cvat/server:${CVAT_VERSION:-v2.80.0}
  restart: unless-stopped
  depends_on: *cvat-dependencies
  environment:
    <<: *cvat-environment
    CVAT_REDIS_INMEM_PASSWORD: ""
  volumes:
    - cvat_data:/home/django/data
    - cvat_keys:/home/django/keys
    - cvat_logs:/home/django/logs
  networks:
    - cvat

services:
  cvat_db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: cvat
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - cvat_db:/var/lib/postgresql/data
    networks:
      - cvat

  cvat_redis_inmem:
    image: redis:7.2.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "100", "--appendonly", "yes"]
    volumes:
      - cvat_inmem_db:/data
    networks:
      - cvat

  cvat_redis_ondisk:
    image: apache/kvrocks:2.15.0
    restart: unless-stopped
    volumes:
      - cvat_cache_db:/var/lib/kvrocks
    networks:
      - cvat

  cvat_opa:
    image: openpolicyagent/opa:1.12.2
    restart: unless-stopped
    command:
      - run
      - --server
      - --addr=:8181
      - --log-level=error
      - --set=services.cvat.url=http://cvat-server:8080
      - --set=bundles.cvat.service=cvat
      - --set=bundles.cvat.resource=/api/auth/rules
      - --set=bundles.cvat.polling.min_delay_seconds=5
      - --set=bundles.cvat.polling.max_delay_seconds=15
    networks:
      cvat:
        aliases:
          - opa

  cvat_server:
    image: cvat/server:${CVAT_VERSION:-v2.80.0}
    restart: unless-stopped
    depends_on:
      <<: *cvat-dependencies
      cvat_opa:
        condition: service_started
    environment:
      <<: *cvat-environment
      DJANGO_MODWSGI_EXTRA_ARGS: ""
      ALLOWED_HOSTS: "*"
      NUMPROCS: 2
    command: init run server nginx
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
    labels:
      traefik.enable: "true"
      traefik.http.services.cvat-api.loadbalancer.server.port: "8080"
      traefik.http.routers.cvat-api.rule: "Host(`${CVAT_HOST:-localhost}`) && (PathPrefix(`/api/`) || PathPrefix(`/static/`) || PathPrefix(`/admin`) || PathPrefix(`/django-rq`))"
      traefik.http.routers.cvat-api.entrypoints: web
      traefik.http.routers.cvat-api.priority: "200"
    networks:
      cvat:
        aliases:
          - cvat-server

  # One worker consumes every queue needed by the local Octate workflow.
  # Separate workers improve throughput in large installations but are not
  # required for video ingestion, annotation, import, or export.
  cvat_worker:
    <<: *cvat-worker
    command: run worker chunks import export annotation cleaning --with-scheduler

  # Official CVAT annotation workflow. Octate branding is applied in front of it.
  # Dashboard routes are served by the frontend service, not this UI.
  cvat_ui:
    image: cvat/ui:${CVAT_VERSION:-v2.80.0}
    restart: unless-stopped
    depends_on:
      - cvat_server
    networks:
      cvat:
        aliases:
          - cvat-ui

  cvat_brand:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - cvat_ui
    volumes:
      - ./brand/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./brand/header.css:/brand/header.css:ro
      - ./brand/header.js:/brand/header.js:ro
      - ./frontend/public/OctoLabel.png:/brand/OctoLabel.png:ro
    labels:
      traefik.enable: "true"
      traefik.http.services.cvat-ui.loadbalancer.server.port: "8080"
      traefik.http.routers.cvat-ui.rule: "Host(`${CVAT_HOST:-localhost}`)"
      traefik.http.routers.cvat-ui.entrypoints: web
      traefik.http.routers.cvat-ui.priority: "10"
      traefik.http.routers.cvat-ui.service: cvat-ui
      traefik.http.middlewares.octate-frame.headers.customframeoptionsvalue: "SAMEORIGIN"
      traefik.http.middlewares.octate-frame.headers.contentsecuritypolicy: "frame-ancestors 'self'"
      traefik.http.routers.cvat-ui.middlewares: octate-frame
    networks:
      - cvat

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - cvat_server
    environment:
      API_SERVER_URL: http://cvat_server:8080
    labels:
      traefik.enable: "true"
      traefik.http.services.octate-ui.loadbalancer.server.port: "3000"
      traefik.http.routers.octate-ui.rule: "Host(`${CVAT_HOST:-localhost}`) && (Path(`/`) || PathPrefix(`/_next`) || Path(`/about`) || Path(`/login`) || Path(`/auth/login`) || Path(`/tasks`) || Path(`/tasks/new`) || Path(`/jobs`) || Path(`/projects`) || Path(`/OctoLabel.png`) || PathRegexp(`^/tasks/[0-9]+$$`) || PathRegexp(`^/projects/[0-9]+$$`))"
      traefik.http.routers.octate-ui.entrypoints: web
      traefik.http.routers.octate-ui.priority: "100"
      traefik.http.routers.octate-ui.service: octate-ui
    networks:
      - cvat

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    ports:
      - "${OCTATE_PORT:-8080}:8080"
    environment:
      CVAT_HOST: "${CVAT_HOST:-localhost}"
      TRAEFIK_ENTRYPOINTS_web_ADDRESS: :8080
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: octate_cvat
      TRAEFIK_LOG_LEVEL: WARN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cvat

  octate-model-gateway:
    build:
      context: ./model-server
    restart: unless-stopped
    environment:
      PORT: 8090
      OCTATE_MODEL_MODE: "${OCTATE_MODEL_MODE:-demo}"
    expose:
      - "8090"
    ports:
      - "127.0.0.1:${OCTATE_MODEL_PORT:-8091}:8090"
    networks:
      - cvat

volumes:
  cvat_db:
  cvat_data:
  cvat_keys:
  cvat_logs:
  cvat_inmem_db:
  cvat_cache_db:

networks:
  cvat:
