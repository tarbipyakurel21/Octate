name: octate
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${OCTATE_PORT:-8080}:8080"
    environment:
      MODEL_SERVER_URL: http://model-server:8090
      OCTATE_DB: /app/data/octate.db
    volumes:
      - octate-data:/app/data
    depends_on:
      model-server:
        condition: service_healthy
  model-server:
    build:
      context: .
      dockerfile: model-server/Dockerfile
    environment:
      PORT: 8090
      OCTATE_MODEL_MODE: ${OCTATE_MODEL_MODE:-demo}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/models')"]
      interval: 3s
      timeout: 2s
      retries: 10
volumes:
  octate-data:
